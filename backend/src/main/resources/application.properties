spring.profiles.active=${APP_PROFILE:prod}

spring.jpa.open-in-view=false
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}

security.jwt.duration=${JWT_DURATION:86400}

cors.origins=http://localhost:3000,http://localhost:5173,https://elissandroa.github.io
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:test@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:123456}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.password-recover.token.minutes=${PASSWORD_RECOVER_TOKEN_MINUTES:30}
email.password-recover.uri=${PASSWORD_RECOVER_URI:http://localhost:3000/recover-password/}

logging.level.org.apache.coyote.http11=ERROR
logging.level.org.springframework.web.multipart=ERROR
logging.level.org.springframework.web.servlet.DispatcherServlet=ERROR
